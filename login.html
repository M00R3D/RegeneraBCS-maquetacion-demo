<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión · Regenera BCS</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="pages.css">
    <link rel="stylesheet" href="login.css">

</head>


<body>

<header class="topbar">

    <a href="index.html" class="logo">

        <span class="logo-mark">
            <img src="path1521.png" alt="Logo">
        </span>

        <span>
            Regenera<span>BCS</span>
        </span>

    </a>

</header>


<main class="auth-page">

    <div class="auth-box">

        <span class="page-label">
            REGENERA BCS
        </span>

        <h1>
            Iniciar sesión
        </h1>

        <p>
            Ingresa para participar en voluntariados
            y llevar un registro de tus actividades.
        </p>


        <form id="loginForm">

            <label>
                Nombre
            </label>

            <input
                type="text"
                id="nombre"
                placeholder="Tu nombre"
                required>


            <label>
                Correo electrónico
            </label>

            <input
                type="email"
                id="correo"
                placeholder="correo@ejemplo.com"
                required>


            <label>
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                placeholder="••••••••"
                required>


            <button type="submit">
                Iniciar sesión →
            </button>

        </form>


        <p class="auth-demo">
            Demo de maquetación · Los datos se almacenan
            únicamente en este navegador.
        </p>

    </div>

</main>


<script src="login.js"></script>

</body>

</html>
